{% extends "_base.html" %}
{% block title %}Passkey einrichten – {{ app_name }}{% endblock %}
{% block content %}
<div class="auth-page">
  <div class="auth-card">
    <h1>{{ app_name }}</h1>
    <p id="auth-status" class="auth-status">Ersten Passkey für diese Anwendung einrichten</p>
    <input id="passkey-label" type="text" placeholder="Gerätename (z. B. \"Laptop\")" class="auth-input" />
    <button id="passkey-register" type="button" class="btn btn-primary">Passkey einrichten</button>
  </div>
</div>
<style>
.auth-page { display:flex; align-items:center; justify-content:center; min-height:100vh; }
.auth-card { max-width:360px; width:100%; padding:2rem; text-align:center; }
.auth-card h1 { margin-bottom:.5rem; }
.auth-status { color:var(--text-muted, #888); margin-bottom:1.5rem; }
.auth-input { width:100%; margin-bottom:1rem; padding:8px 12px; border-radius:8px; border:1px solid var(--border, #444); background:var(--bg-2, transparent); color:inherit; }
</style>
{% endblock %}
{% block extra_js %}
<script>
function b64uToBuf(s) {
  s = s.replace(/-/g, '+').replace(/_/g, '/');
  while (s.length % 4) s += '=';
  const bin = atob(s);
  const buf = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) buf[i] = bin.charCodeAt(i);
  return buf.buffer;
}
function bufToB64u(buf) {
  const bytes = new Uint8Array(buf);
  let bin = '';
  for (const b of bytes) bin += String.fromCharCode(b);
  return btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}

document.getElementById('passkey-register').addEventListener('click', async () => {
  const status = document.getElementById('auth-status');
  const label = document.getElementById('passkey-label').value || 'Passkey';
  status.textContent = 'Warte auf Passkey …';
  try {
    const optRes = await fetch('/auth/register/options', { method: 'POST' });
    if (!optRes.ok) throw new Error('Nicht berechtigt (bereits ein Passkey vorhanden, nicht angemeldet?)');
    const opts = await optRes.json();
    opts.challenge = b64uToBuf(opts.challenge);
    opts.user.id = b64uToBuf(opts.user.id);
    if (opts.excludeCredentials) {
      opts.excludeCredentials = opts.excludeCredentials.map((c) => ({ ...c, id: b64uToBuf(c.id) }));
    }

    const credential = await navigator.credentials.create({ publicKey: opts });
    const payload = {
      label,
      credential: {
        id: credential.id,
        rawId: bufToB64u(credential.rawId),
        type: credential.type,
        response: {
          clientDataJSON: bufToB64u(credential.response.clientDataJSON),
          attestationObject: bufToB64u(credential.response.attestationObject),
        },
      },
    };

    const verifyRes = await fetch('/auth/register/verify', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload),
    });
    const result = await verifyRes.json();
    if (result.ok) {
      window.location.href = '/';
    } else {
      status.textContent = 'Einrichtung fehlgeschlagen.';
    }
  } catch (e) {
    status.textContent = 'Fehler: ' + e.message;
  }
});
</script>
{% endblock %}
